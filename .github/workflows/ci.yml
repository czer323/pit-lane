name: CI

# Fork wake-up test: forcing workflow re-evaluation on push (PR branch).
on:
  pull_request:
  # Manual trigger: escape hatch for fork-Actions dormancy. When a PR gets no
  # CI run (fork pipeline idle), dispatch this workflow to wake it and verify.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true

      - run: vp install

      - run: vp check

      - run: vp test -- --run

      # E2E gate: the mock UI behavior contract (SLOT-19). Playwright suite runs
      # against the static mock served by scripts/serve-mocked-ui.mjs — no build
      # needed. --with-deps installs the runner's system libraries.
      - run: vp exec playwright install --with-deps chromium

      - run: vp run test:e2e
